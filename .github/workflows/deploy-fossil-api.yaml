name: Deploy Fossil api to ECS
on:
  push:
    branches:
      - handover-updates
      - feat/message-workflow
  # Called by main workflow
  workflow_call:
  # Allow manual trigger for testing
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fossil-images-repository
  ECS_SERVICE: fossil-fossil-api-ecs
  ECS_CLUSTER: fossil-ecs-cluster
  CONTAINER_NAME: fossil-api
  TASK_NAME: fossil-api-ecs
  DOCKER_IMAGE: ametelnethermind/fossil-api:latest

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::065525255352:role/kyoto-fossil-github-oidc-role
          role-session-name: Github
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Pull Docker image from Docker Hub and push to ECR
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          # Pull the image from Docker Hub
          echo "Pulling image from Docker Hub..."
          docker pull ${{ env.DOCKER_IMAGE }}
          
          # Create ECR image tag
          IMAGE_TAG=fossil-api-${{ github.sha }}
          ECR_IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Tag the Docker Hub image for ECR
          echo "Tagging image for ECR..."
          docker tag ${{ env.DOCKER_IMAGE }} $ECR_IMAGE_URI
          
          # Push to ECR
          echo "Pushing image to ECR..."
          docker push $ECR_IMAGE_URI
          
          # Set the ECR image URI as environment variable for next steps
          echo "IMAGE_URI=$ECR_IMAGE_URI" >> $GITHUB_ENV
          echo "Pushed image: $ECR_IMAGE_URI"

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.TASK_NAME }} --query taskDefinition > task-definition.json

      - name: Log task definition
        run: cat task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
