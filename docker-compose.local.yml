# Local integration testing compose file for fossil-monorepo
# Self-contained setup with local Katana instance instead of external fossil-network services
services:
  # Katana Local Testnet
  katana:
    image: ghcr.io/dojoengine/katana:v1.6.3
    ports:
      - "5050:5050"
    networks:
      - local-network
    command:
      [
        "katana",
        "--http.addr",
        "0.0.0.0",
        "--http.port",
        "5050",
        "--http.cors_origins",
        "*",
        "--dev",
        "--dev.no-fee",
        "--dev.no-account-validation",
        "--block-time",
        "6000",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-X",
          "POST",
          "-H",
          "Content-Type: application/json",
          "-d",
          '{"jsonrpc":"2.0","method":"starknet_chainId","params":[],"id":1}',
          "http://localhost:5050",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Proving Service PostgreSQL (port 5433 to avoid conflicts with external indexer)
  proving_service_db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    networks:
      - local-network
    volumes:
      - proving_service_local_data:/var/lib/postgresql/data
      - ./proving-service/tests/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Offchain Processor PostgreSQL (port 5434)
  offchain_processor_db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    networks:
      - local-network
    volumes:
      - offchain_processor_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack for SQS (AWS emulation)
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4567:4566"
    networks:
      - local-network
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - localstack_local_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-sqs.sh
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues", "--region", "us-east-1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Proving Service HTTP API
  proving-service-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.proving-service-api
    image: fossil-proving-service-api:latest
    depends_on:
      proving_service_db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      PROVING_SERVICE_DATABASE_URL: postgres://postgres:postgres@proving_service_db:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@proving_service_db:5432/postgres
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/fossilQueue
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      RUST_LOG: info
      SERVER_PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - local-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Message Handler Background Service
  message-handler:
    image: ametelnethermind/fossil-message-handler
    depends_on:
      proving_service_db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      PROVING_SERVICE_DATABASE_URL: postgres://postgres:postgres@proving_service_db:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@proving_service_db:5432/postgres
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/fossilQueue
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      RUST_LOG: debug
    networks:
      - local-network
    restart: unless-stopped

  # Offchain Processor Service
  offchain-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.offchain-processor
    image: fossil-offchain-processor:latest
    depends_on:
      offchain_processor_db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      OFFCHAIN_PROCESSOR_DATABASE_URL: postgres://postgres:postgres@offchain_processor_db:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@offchain_processor_db:5432/postgres
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PROVING_SERVICE_URL: http://proving-service-api:3001
      RUST_LOG: info
      SERVER_PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - local-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  local-network:
    driver: bridge

volumes:
  proving_service_local_data:
  offchain_processor_local_data:
  localstack_local_data:
