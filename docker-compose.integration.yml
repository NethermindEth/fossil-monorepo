# Integration testing compose file for fossil-monorepo
# Connects to external fossil-network services while providing isolated test databases
services:
  # Proving Service PostgreSQL (port 5433 to avoid conflicts with external indexer)
  proving_service_db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    networks:
      - fossil-network
      - internal
    volumes:
      - proving_service_data:/var/lib/postgresql/data
      - ./proving-service/tests/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Fossil API PostgreSQL (port 5434)
  fossil_api_db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    networks:
      - fossil-network
      - internal
    volumes:
      - fossil_api_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack for SQS (AWS emulation)
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4567:4566"
    networks:
      - fossil-network
      - internal
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fossil API Service
  fossil-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.fossil-api
    image: fossil-api:latest
    depends_on:
      fossil_api_db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@fossil_api_db:5432/postgres
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      RUST_LOG: info
      SERVER_PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - fossil-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Contract Deployer - deploys to external Katana
  contract-deployer:
    build:
      context: .
      dockerfile: docker/Dockerfile.deploy
    image: fossil-deploy:latest
    networks:
      - fossil-network
    volumes:
      - ./starknet-contracts:/app/starknet-contracts
      - ./scripts:/app/scripts
      - ./.env.docker:/app/.env.docker
      - ./.env.local:/app/.env.local
    working_dir: /app
    stdin_open: true
    tty: true
    command:
      [
        "sh",
        "-c",
        "chmod +x scripts/deploy-starknet.sh && ./scripts/deploy-starknet.sh docker",
      ]
    restart: "no"
    profiles:
      - deploy

networks:
  fossil-network:
    external: true
    name: fossil-network
  internal:
    driver: bridge

volumes:
  proving_service_data:
  fossil_api_data:
  localstack_data:
